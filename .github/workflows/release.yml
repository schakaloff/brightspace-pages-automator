name: Release

on:
  push:
    branches: [main, dev]

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        run: |
          python3 - <<'EOF'
          import re, os
          text = open("src/app_version.py", encoding="utf-8").read()
          m = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', text)
          version = m.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          EOF

  build-windows:
    needs: get-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Check updater and GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_update_checker.py tests/test_update_installer.py tests/test_update_integrity.py tests/test_update_dialog.py tests/test_update_ssl.py tests/test_update_versioning.py tests/test_update_fetch_errors.py tests/test_macos_update.py tests/test_gui_startup.py -q
      - name: Write build version
        shell: bash
        run: echo "v${{ needs.get-version.outputs.version }}-${{ github.run_number }}" > BUILD_VERSION
      - name: Write build commit
        shell: bash
        run: git rev-parse --short HEAD > BUILD_COMMIT
      - run: pyinstaller installer/brightspace_automator.spec --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup -y
      - run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.get-version.outputs.version }} installer\windows.iss
      - name: Add stable latest installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer\output\BrightspacePagesAutomator-Setup-*.exe |
            Where-Object { $_.Name -ne "BrightspacePagesAutomator-Setup-Latest.exe" } |
            Select-Object -First 1
          Copy-Item $installer.FullName installer\output\BrightspacePagesAutomator-Setup-Latest.exe
      # The app refuses to execute a downloaded installer that isn't listed here
      # with a matching digest, so this step is required for self-update to work.
      # Format is plain `sha256sum` output: "<64 hex>  <filename>".
      - name: Generate installer checksums
        shell: pwsh
        run: |
          $out = "installer\output\SHA256SUMS.txt"
          $lines = Get-ChildItem installer\output\BrightspacePagesAutomator-Setup-*.exe |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            }
          if (-not $lines) { Write-Error "No installers found to checksum"; exit 1 }
          Set-Content -Path $out -Value $lines -Encoding ascii
          Get-Content $out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer/output/BrightspacePagesAutomator-Setup-*.exe
            installer/output/SHA256SUMS.txt

  build-mac:
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Check updater and GUI startup on Mac
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_update_checker.py tests/test_update_installer.py tests/test_update_integrity.py tests/test_update_dialog.py tests/test_update_ssl.py tests/test_update_versioning.py tests/test_update_fetch_errors.py tests/test_macos_update.py tests/test_gui_startup.py -q
      - name: Write build version
        run: echo "v${{ needs.get-version.outputs.version }}-${{ github.run_number }}" > BUILD_VERSION
      - name: Write build commit
        run: git rev-parse --short HEAD > BUILD_COMMIT
      - run: pyinstaller installer/brightspace_automator_mac.spec --noconfirm
      - name: Wrap .app into a .dmg
        run: |
          # hdiutil intermittently fails with "Resource busy" right after PyInstaller's
          # ad-hoc code-signing step on GitHub's macOS runners — retry a few times.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Brightspace Pages Automator" \
              -srcfolder "dist/Brightspace Pages Automator.app" \
              -ov -format UDZO \
              "BrightspacePagesAutomator-${{ needs.get-version.outputs.version }}-${{ matrix.arch }}.dmg" && break
            echo "hdiutil failed (attempt $i), retrying in 5s..."
            sleep 5
          done
          test -f "BrightspacePagesAutomator-${{ needs.get-version.outputs.version }}-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: BrightspacePagesAutomator-*.dmg

  release:
    needs: [get-version, build-windows, build-mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog entry
        run: |
          python3 - <<'EOF'
          import re
          version = "${{ needs.get-version.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf'^## {re.escape(version)}\s*\n(.*?)(?=\n## |\Z)',
              text, re.S | re.M,
          )
          notes = m.group(1).strip() if m else "No changelog entry for this version."
          open("release_notes.md", "w", encoding="utf-8").write(notes)
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-dmg-*
          merge-multiple: true
          path: dist-artifacts
      - name: Publish checksums for Windows and both Mac installers
        run: |
          python3 - <<'EOF'
          import hashlib
          from pathlib import Path
          root = Path('dist-artifacts')
          assets = sorted(p for p in root.iterdir() if p.suffix in ('.exe', '.dmg'))
          if not assets or len(list(root.glob('*.dmg'))) != 2:
              raise SystemExit('Both Mac architectures and Windows installers are required')
          with (root / 'SHA256SUMS.txt').open('w', encoding='ascii') as out:
              for path in assets:
                  with path.open('rb') as src:
                      digest = hashlib.file_digest(src, 'sha256').hexdigest()
                  out.write(f'{digest}  {path.name}\n')
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}-${{ github.run_number }}
          name: v${{ needs.get-version.outputs.version }}-${{ github.run_number }}
          body_path: release_notes.md
          files: dist-artifacts/**
